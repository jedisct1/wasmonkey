[package]
keywords = ["wasm", "webassembly", "patcher", "object-file", "cli"]
name = "wasmonkey"
version = "0.1.18"
authors = ["Frank Denis <github@pureftpd.org>"]
description = "WebAssembly object-file patcher for replacing exported functions with imports from a builtins library"
license = "ISC"
homepage = "https://github.com/jedisct1/wasmonkey"
repository = "https://github.com/jedisct1/wasmonkey"
categories = ["wasm"]
edition = "2018"

[dependencies]
clap = { version = "3.2.25", default-features = false, features = [
    "std",
    "cargo",
    "wrap_help",
] }
anyhow = "1.0.104"
goblin = "0.6.1"
lazy_static = "1.5.0"
parity-wasm = "0.45.0"
serde = "1.0.229"
serde_derive = "1.0.229"
serde_json = "1.0.151"
siphasher = "0.3.11"
thiserror = "1.0.69"
